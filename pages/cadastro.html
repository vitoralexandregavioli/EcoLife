<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crie sua conta EcoLife e comece sua jornada sustentável.">
  <title>Criar conta | EcoLife</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { floresta: '#174D36', natureza: '#65A66A', suave: '#DDF0D7', creme: '#F5F4EA' },
      fontFamily: { titulo: ['Poppins', 'sans-serif'], texto: ['Inter', 'sans-serif'] }
    } } };
  </script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="min-h-screen bg-creme font-texto text-slate-800 antialiased">
  <header class="border-b border-floresta/10 bg-white/90">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4" aria-label="Navegação principal">
      <a class="font-titulo text-xl font-bold text-floresta" href="../index.html">EcoLife</a>
      <div id="auth-menu" class="flex flex-wrap items-center gap-4 text-sm" aria-live="polite">
        <a class="font-semibold text-floresta hover:underline" href="login.html">Entrar</a>
        <a class="rounded-lg bg-natureza px-3 py-2 font-semibold text-white hover:bg-floresta" href="cadastro.html">Criar conta</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-md px-5 py-12 sm:py-20">
    <section class="cartao-base">
      <p class="text-sm font-semibold text-natureza">Pequenas atitudes, grandes mudanças</p>
      <h1 class="mt-2 font-titulo text-3xl font-bold text-floresta">Criar conta</h1>
      <p class="mt-2 text-sm leading-6 text-slate-600">Cadastre-se para começar a acompanhar seus hábitos sustentáveis.</p>

      <form id="form-cadastro" class="mt-8 space-y-5" novalidate>
        <div>
          <label for="nome" class="mb-1 block text-sm font-semibold">Nome</label>
          <input id="nome" name="nome" type="text" autocomplete="name" required maxlength="80" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-3 focus:border-natureza focus:outline-none" placeholder="Seu nome">
        </div>
        <div>
          <label for="email" class="mb-1 block text-sm font-semibold">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-3 focus:border-natureza focus:outline-none" placeholder="voce@exemplo.com">
        </div>
        <div>
          <label for="senha" class="mb-1 block text-sm font-semibold">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="new-password" required minlength="6" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-3 focus:border-natureza focus:outline-none" placeholder="Mínimo de 6 caracteres">
        </div>
        <div>
          <label for="confirmar-senha" class="mb-1 block text-sm font-semibold">Confirmar senha</label>
          <input id="confirmar-senha" name="confirmar-senha" type="password" autocomplete="new-password" required minlength="6" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-3 focus:border-natureza focus:outline-none" placeholder="Digite a senha novamente">
        </div>
        <button id="botao-cadastro" type="submit" class="w-full rounded-lg bg-floresta px-4 py-3 font-semibold text-white transition hover:bg-natureza disabled:cursor-wait disabled:opacity-60">Criar minha conta</button>
      </form>
      <p class="mt-6 text-center text-sm text-slate-600">Já tem uma conta? <a class="font-semibold text-floresta underline" href="login.html">Entrar</a></p>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
