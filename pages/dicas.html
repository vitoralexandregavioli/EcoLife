<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Encontre dicas simples de sustentabilidade para o dia a dia.">
  <title>Dicas sustentáveis | EcoLife</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { floresta: '#174D36', natureza: '#65A66A', suave: '#DDF0D7', creme: '#F5F4EA' },
      fontFamily: { titulo: ['Poppins', 'sans-serif'], texto: ['Inter', 'sans-serif'] }
    } } };
  </script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="min-h-screen bg-creme font-texto text-slate-800 antialiased">
  <header class="border-b border-floresta/10 bg-white/95">
    <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-5 py-4" aria-label="Navegação principal">
      <a class="flex items-center gap-2 font-titulo text-xl font-bold text-floresta" href="../index.html" aria-label="EcoLife, página inicial"><i data-lucide="leaf" class="h-6 w-6" aria-hidden="true"></i><span>EcoLife</span></a>
      <div class="flex flex-wrap items-center gap-4 text-sm">
        <a class="font-semibold text-floresta hover:underline" href="../index.html">Início</a>
        <a class="font-semibold text-floresta hover:underline" href="reciclagem.html">Reciclagem</a>
        <a class="font-semibold text-floresta hover:underline" href="galeria.html">Galeria</a>
        <a class="font-semibold text-floresta hover:underline" href="contato.html">Contato</a>
        <div id="auth-menu" class="flex flex-wrap items-center gap-3" aria-live="polite"></div>
      </div>
    </nav>
  </header>

  <main>
    <section class="bg-floresta px-5 py-14 text-white sm:py-20">
      <div class="mx-auto max-w-6xl">
        <p class="inline-flex items-center gap-2 rounded-full bg-white/10 px-4 py-2 text-sm font-semibold"><i data-lucide="lightbulb" class="h-4 w-4" aria-hidden="true"></i>Ideias que cabem na rotina</p>
        <h1 class="mt-5 max-w-3xl font-titulo text-4xl font-bold sm:text-5xl">Dicas sustentáveis para o dia a dia</h1>
        <p class="mt-4 max-w-2xl text-lg leading-8 text-white/85">Busque por um tema ou filtre por categoria para encontrar uma atitude simples para experimentar.</p>
      </div>
    </section>

    <section class="mx-auto max-w-6xl px-5 py-12" aria-labelledby="titulo-dicas">
      <div class="mb-6 max-w-xl">
        <label for="busca-dicas" class="mb-1 block text-sm font-semibold">Buscar dica</label>
        <div class="flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-3 focus-within:border-natureza focus-within:ring-2 focus-within:ring-natureza/20">
          <i data-lucide="search" class="h-5 w-5 text-slate-500" aria-hidden="true"></i>
          <input id="busca-dicas" type="search" class="w-full border-0 py-3 outline-none" placeholder="Ex.: banho, compras, alimentos" autocomplete="off">
        </div>
      </div>
      <div id="filtros-dicas" class="mb-6 flex flex-wrap gap-2" aria-label="Filtrar dicas por categoria">
        <button type="button" data-categoria="todas" aria-pressed="true" class="filtro-dica rounded-full bg-floresta px-4 py-2 text-sm font-semibold text-white">Todas</button>
        <button type="button" data-categoria="Água" aria-pressed="false" class="filtro-dica rounded-full border border-floresta/20 bg-white px-4 py-2 text-sm font-semibold text-floresta">Água</button>
        <button type="button" data-categoria="Energia" aria-pressed="false" class="filtro-dica rounded-full border border-floresta/20 bg-white px-4 py-2 text-sm font-semibold text-floresta">Energia</button>
        <button type="button" data-categoria="Consumo consciente" aria-pressed="false" class="filtro-dica rounded-full border border-floresta/20 bg-white px-4 py-2 text-sm font-semibold text-floresta">Consumo consciente</button>
        <button type="button" data-categoria="Alimentação sustentável" aria-pressed="false" class="filtro-dica rounded-full border border-floresta/20 bg-white px-4 py-2 text-sm font-semibold text-floresta">Alimentação</button>
        <button type="button" data-categoria="Redução de resíduos" aria-pressed="false" class="filtro-dica rounded-full border border-floresta/20 bg-white px-4 py-2 text-sm font-semibold text-floresta">Redução de resíduos</button>
      </div>
      <p id="estado-dicas" class="mb-4 text-sm text-slate-600" role="status" aria-live="polite"></p>
      <div id="lista-dicas" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3" aria-labelledby="titulo-dicas"></div>
      <h2 id="titulo-dicas" class="sr-only">Lista de dicas</h2>
    </section>
  </main>

  <footer class="border-t border-floresta/10 bg-white">
    <div class="mx-auto flex max-w-6xl flex-col gap-3 px-5 py-7 sm:flex-row sm:items-center sm:justify-between">
      <a class="font-titulo font-bold text-floresta" href="../index.html">EcoLife</a><p class="text-sm text-slate-600">Pequenas atitudes, grandes mudanças.</p><a class="text-sm font-semibold text-floresta underline" href="galeria.html">Conheça a galeria</a>
    </div>
  </footer>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dicas.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
