<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gerencie suas categorias de desafios sustentáveis no EcoLife.">
  <title>Categorias | EcoLife</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { floresta: '#174D36', natureza: '#65A66A', suave: '#DDF0D7', creme: '#F5F4EA' },
      fontFamily: { titulo: ['Poppins', 'sans-serif'], texto: ['Inter', 'sans-serif'] }
    } } };
  </script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="min-h-screen bg-creme font-texto text-slate-800 antialiased">
  <header class="border-b border-floresta/10 bg-white/90">
    <nav class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-5 py-4" aria-label="Navegação principal">
      <a class="flex items-center gap-2 font-titulo text-xl font-bold text-floresta" href="../index.html" aria-label="EcoLife, página inicial">
        <i data-lucide="leaf" class="h-6 w-6" aria-hidden="true"></i>
        <span>EcoLife</span>
      </a>
      <div id="auth-menu" class="flex flex-wrap items-center gap-4 text-sm" aria-live="polite"></div>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-5 py-10 sm:py-14">
    <div class="mb-8">
      <p class="text-sm font-semibold text-natureza">Organize suas ações</p>
      <h1 class="mt-1 font-titulo text-3xl font-bold text-floresta sm:text-4xl">Minhas categorias</h1>
      <p class="mt-3 max-w-2xl leading-7 text-slate-600">Crie categorias para agrupar desafios sustentáveis, como Água, Energia e Reciclagem.</p>
    </div>

    <div class="grid items-start gap-8 lg:grid-cols-[minmax(0,0.85fr)_minmax(0,1.15fr)]">
      <section class="cartao-base" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario" class="font-titulo text-xl font-semibold text-floresta">Nova categoria</h2>
        <form id="form-categoria" class="mt-6 space-y-5" novalidate>
          <div>
            <label for="nome-categoria" class="mb-1 block text-sm font-semibold">Nome <span aria-hidden="true">*</span></label>
            <input id="nome-categoria" name="nome" type="text" required maxlength="80" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-3 focus:border-natureza focus:outline-none" placeholder="Ex.: Reciclagem" aria-describedby="ajuda-nome">
            <p id="ajuda-nome" class="mt-1 text-xs text-slate-500">Use um nome curto e claro (até 80 caracteres).</p>
          </div>
          <div>
            <label for="descricao-categoria" class="mb-1 block text-sm font-semibold">Descrição</label>
            <textarea id="descricao-categoria" name="descricao" rows="4" maxlength="500" class="w-full resize-y rounded-lg border border-slate-300 bg-white px-3 py-3 focus:border-natureza focus:outline-none" placeholder="Descreva o tema desta categoria (opcional)."></textarea>
          </div>
          <div class="flex flex-wrap gap-3">
            <button id="botao-salvar-categoria" type="submit" class="inline-flex items-center gap-2 rounded-lg bg-floresta px-5 py-3 font-semibold text-white transition hover:bg-natureza disabled:cursor-wait disabled:opacity-60">
              <i data-lucide="save" class="h-4 w-4" aria-hidden="true"></i>
              <span>Salvar categoria</span>
            </button>
            <button id="botao-cancelar-edicao" type="button" class="hidden rounded-lg border border-slate-300 px-5 py-3 font-semibold text-slate-700 hover:bg-slate-50">Cancelar edição</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="titulo-lista">
        <div class="mb-4 flex items-center justify-between gap-3">
          <h2 id="titulo-lista" class="font-titulo text-xl font-semibold text-floresta">Categorias cadastradas</h2>
          <button id="botao-atualizar" type="button" class="inline-flex items-center gap-2 rounded-lg border border-floresta/20 bg-white px-3 py-2 text-sm font-semibold text-floresta hover:bg-suave" aria-label="Atualizar lista">
            <i data-lucide="refresh-cw" class="h-4 w-4" aria-hidden="true"></i>
            Atualizar
          </button>
        </div>
        <p id="estado-lista" class="rounded-xl border border-floresta/10 bg-white p-5 text-sm text-slate-600" role="status" aria-live="polite">Carregando categorias...</p>
        <div id="lista-categorias" class="grid gap-4 sm:grid-cols-2"></div>
      </section>
    </div>
  </main>

  <footer class="mt-10 border-t border-floresta/10 bg-white/70">
    <div class="mx-auto max-w-6xl px-5 py-6 text-sm text-slate-600">EcoLife · Pequenas atitudes, grandes mudanças.</div>
  </footer>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/categorias.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
